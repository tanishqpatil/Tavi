name: Signed Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build, for example v0.1.0-alpha.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and sign ARM64 release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - name: Check out the release tag and pinned runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Validate version, tag and main-branch ancestry
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release.py metadata --tag "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install matching SDK, NDK and CMake
        run: >-
          sdkmanager --install
          'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          'ndk;28.2.13676358' 'cmake;4.1.2'

      - name: Validate Gradle wrapper and read dependency cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Restore the private signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TAVI_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_BASE64" || { echo 'Missing release signing secret.' >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tavi-release.p12"

      - name: Test, lint and build the signed release
        env:
          TAVI_SIGNING_KEYSTORE: ${{ runner.temp }}/tavi-release.p12
          TAVI_SIGNING_STORE_PASSWORD: ${{ secrets.TAVI_SIGNING_STORE_PASSWORD }}
          TAVI_SIGNING_KEY_ALIAS: ${{ secrets.TAVI_SIGNING_KEY_ALIAS }}
          TAVI_SIGNING_KEY_PASSWORD: ${{ secrets.TAVI_SIGNING_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --no-configuration-cache --stacktrace --max-workers=2
          :app:testDebugUnitTest :app:lintRelease
          :app:assembleRelease :app:assembleDebugAndroidTest

      - name: Verify release identity, signature, ABI and alignment
        run: >-
          python3 scripts/release.py verify
          --apk app/build/outputs/apk/release/app-release.apk
          --build-tools "$ANDROID_HOME/build-tools/36.0.0"
          --output dist

      - name: Upload verified release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tavi-release-${{ steps.version.outputs.tag }}-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Remove private signing material
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/tavi-release.p12"

      - name: Upload release test and lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release.*
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish direct APK download
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified build files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Tavi-release-${{ needs.build.outputs.tag }}-${{ github.run_id }}
          path: dist

      - name: Recheck the APK download checksum
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      # Upload privately first; never replace assets on an already-published release.
      - name: Publish the verified APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > existing-release.txt 2>/dev/null; then
            test "$(cat existing-release.txt)" = true || { echo 'Release is already published; refusing to overwrite it.' >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Tavi $RELEASE_TAG" --notes-file dist/RELEASE-NOTES.txt
          fi
          gh release upload "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS.txt dist/BUILD-INFO.txt --clobber
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
          release_url="https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG"
          echo "[Download the signed ARM64 APK]($release_url)" >> "$GITHUB_STEP_SUMMARY"
